name: EPA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: İmza anahtarı (gizli değişken varsa)
        env:
          KS: ${{ secrets.EPA_KEYSTORE_B64 }}
          KP: ${{ secrets.EPA_KEYSTORE_PASS }}
        run: |
          # Dosyanın tamamı tek bir gizli değişkene yapıştırıldıysa şifreyi ve anahtarı içinden ayıkla
          ALL="$KP"$'\n'"$KS"
          if [ ${#KP} -gt 100 ] || [ -z "$KS" ]; then
            P2=$(printf '%s\n' "$ALL" | tr -d '\r' | grep -A2 'EPA_KEYSTORE_PASS' | grep -vE 'Name:|Secret' | head -1 | tr -d ' ')
            K2=$(printf '%s\n' "$ALL" | tr -d '\r' | grep -E '^[[:space:]]*[A-Za-z0-9+/=]{1000,}[[:space:]]*$' | head -1 | tr -d ' ')
            [ -n "$P2" ] && KP="$P2"
            [ -n "$K2" ] && KS="$K2"
          fi
          [ -n "$KP" ] && echo "::add-mask::$KP"
          {
            echo "anahtar uzunluk: ${#KS}"
            echo "şifre uzunluk: ${#KP}"
          } > "$RUNNER_TEMP/imza-durumu.txt"
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/epa.keystore" 2>/dev/null
            if keytool -list -keystore "$RUNNER_TEMP/epa.keystore" -storepass "$KP" >/dev/null 2>&1; then
              echo "durum: SABİT ANAHTAR KULLANILIYOR" >> "$RUNNER_TEMP/imza-durumu.txt"
              echo "EPA_KEYSTORE_PATH=$RUNNER_TEMP/epa.keystore" >> "$GITHUB_ENV"
              echo "EPA_KEYSTORE_PASS=$KP" >> "$GITHUB_ENV"
            else
              echo "durum: anahtar ve şifre uyumsuz, varsayılan anahtar kullanıldı" >> "$RUNNER_TEMP/imza-durumu.txt"
            fi
          else
            echo "durum: gizli değişken eksik, varsayılan anahtar kullanıldı" >> "$RUNNER_TEMP/imza-durumu.txt"
          fi
          cat "$RUNNER_TEMP/imza-durumu.txt"
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk EPA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EPA-APK
          path: EPA.apk
      - name: Releases bölümüne yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed "s/[^0-9.]//g")
          TAG="v${VER}.${{ github.run_number }}"
          gh release create "$TAG" EPA.apk \
            --target "${{ github.sha }}" \
            --title "EPA $TAG" \
            --notes "EPA · EP Academy Sport & Performance - Android APK. Telefonda EPA.apk dosyasına dokunup indirin ve kurun. iPhone için: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ adresini Safari'de açıp Paylaş › Ana Ekrana Ekle. Kayıtlar telefonda tutulur; düzenli yedek alın."
      - name: APK'yı apk dalına koy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/imza-durumu.txt" imza-durumu.txt
          git add -f EPA.apk imza-durumu.txt
          git commit -m "EPA APK (derleme ${{ github.run_number }})"
          git push -f origin apk
