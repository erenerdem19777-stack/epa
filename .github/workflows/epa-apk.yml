name: EPA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: İmza anahtarı (gizli değişken varsa)
        env:
          KS: ${{ secrets.EPA_KEYSTORE_B64 }}
          KP: ${{ secrets.EPA_KEYSTORE_PASS }}
        run: |
          {
            echo "EPA_KEYSTORE_B64 uzunluk: ${#KS}"
            echo "EPA_KEYSTORE_PASS uzunluk: ${#KP}"
          } > "$RUNNER_TEMP/imza-durumu.txt"
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/epa.keystore" && echo "anahtar dosyası: $(stat -c%s "$RUNNER_TEMP/epa.keystore") bayt" >> "$RUNNER_TEMP/imza-durumu.txt" || echo "anahtar çözülemedi" >> "$RUNNER_TEMP/imza-durumu.txt"
            if [ -n "$KP" ] && keytool -list -keystore "$RUNNER_TEMP/epa.keystore" -storepass "$KP" >/dev/null 2>&1; then echo "anahtar ve şifre: uyumlu" >> "$RUNNER_TEMP/imza-durumu.txt"; else echo "anahtar ve şifre: UYUMSUZ ya da eksik" >> "$RUNNER_TEMP/imza-durumu.txt"; fi
            echo "EPA_KEYSTORE_PATH=$RUNNER_TEMP/epa.keystore" >> "$GITHUB_ENV"
          fi
          cat "$RUNNER_TEMP/imza-durumu.txt"
      - name: APK derle
        env:
          EPA_KEYSTORE_PASS: ${{ secrets.EPA_KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk EPA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EPA-APK
          path: EPA.apk
      - name: Releases bölümüne yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed "s/[^0-9.]//g")
          TAG="v${VER}.${{ github.run_number }}"
          gh release create "$TAG" EPA.apk \
            --target "${{ github.sha }}" \
            --title "EPA $TAG" \
            --notes "EPA · EP Academy Sport & Performance - Android APK. Telefonda EPA.apk dosyasına dokunup indirin ve kurun. iPhone için: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ adresini Safari'de açıp Paylaş › Ana Ekrana Ekle. Kayıtlar telefonda tutulur; düzenli yedek alın."
      - name: APK'yı apk dalına koy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/imza-durumu.txt" imza-durumu.txt
          git add -f EPA.apk imza-durumu.txt
          git commit -m "EPA APK (derleme ${{ github.run_number }})"
          git push -f origin apk
