name: EPA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk EPA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EPA-APK
          path: EPA.apk
      - name: Releases bölümüne yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed "s/[^0-9.]//g")
          TAG="v${VER}.${{ github.run_number }}"
          gh release create "$TAG" EPA.apk \
            --target "${{ github.sha }}" \
            --title "EPA $TAG" \
            --notes "EPA · EP Academy Sport & Performance - Android APK. Telefonda EPA.apk dosyasına dokunup indirin ve kurun. iPhone için: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ adresini Safari'de açıp Paylaş › Ana Ekrana Ekle. Kayıtlar telefonda tutulur; düzenli yedek alın."
      - name: APK'yı apk dalına koy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          git add -f EPA.apk
          git commit -m "EPA APK (derleme ${{ github.run_number }})"
          git push -f origin apk
