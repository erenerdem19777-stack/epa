<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: kulüp ofisinin işleyen aracı — net, hızlı, güven veren
   IDEA: antrenör panosu + oyuncu kütüğü kartı
   PICTURE: çalışan uygulamanın kendisi; üstte saha yeşili bant ve canlı göstergeler
   COLOUR/TYPE: EP Academy markası — siyah #111, sarı #ffd100, beyaz; Outfit + Inter
   LAYOUT: üst bant + sekmeler, içerik 1240px, telefonda tek kolon */
:root{color-scheme:light dark;
--bg:light-dark(#f5f5f2,#0c0c0c);--card:light-dark(#fff,#171717);--ink:light-dark(#141414,#f0f0ec);--mute:light-dark(#5f6368,#a3a3a0);
--line:light-dark(#e4e4e0,#2b2b2b);--brand:#111;--pitch:light-dark(#151515,#ffd100);--onp:light-dark(#fff,#111);--acc:#ffd100;--gold:light-dark(#9a7700,#ffd100);--ok:light-dark(#127a46,#4fd18b);--bad:light-dark(#c62828,#ff7b7b);--warn:light-dark(#a15c00,#ffb45c);
--chip:light-dark(#f0f0eb,#232323)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}
.top{background:var(--brand);border-bottom:4px solid #ffd100;color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 0 max(4vw,16px,env(safe-area-inset-left));position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border:2px solid #ffffff22;border-radius:50%;pointer-events:none}
.top::before{content:"";position:absolute;right:70px;top:-10px;bottom:0;border-left:2px solid #ffffff22;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1240px;margin:auto}
.brand>img+div{flex:1 1 160px}.brand h1{font-size:clamp(24px,3.4vw,34px)}
.brand .sub{opacity:.8;font-size:14px}
.sync{margin-left:auto;font-size:13px;background:#ffffff1c;padding:6px 10px;border-radius:99px;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:14px auto 0;scrollbar-width:none}
nav a{flex:none;color:#fff;text-decoration:none;padding:12px 14px;border-radius:10px 10px 0 0;font-weight:500;opacity:.85;font-size:15px}
nav a.on{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1240px;margin:auto;padding:22px max(4vw,16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(4vw,16px,env(safe-area-inset-left))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .v{font:600 clamp(26px,3vw,34px)/1.1 Outfit,sans-serif;white-space:nowrap}
.kpi .l{color:var(--mute);font-size:14px}.kpi .s{font-size:13px;margin-top:4px}
.mute{color:var(--mute)}.small{font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
button.p,.btn.p{background:var(--pitch);border-color:var(--pitch);color:var(--onp)}
button.a{background:var(--acc);border-color:#e0b800;color:#111;font-weight:600}
button.sm,.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
button.x{border:0;background:none;color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid light-dark(#111,#ffd100);outline-offset:2px;box-shadow:0 0 0 6px #ffd10088}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:80px}
label{display:block;font-size:14px;color:var(--mute)}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink)}
label.ck{display:flex;gap:10px;align-items:center;color:var(--ink);min-height:44px}
label.ck input{width:22px;min-height:22px;margin:0}
fieldset{border:0;padding:0;margin:0 0 18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
legend{font:600 16px Outfit,sans-serif;padding:0 0 8px;color:var(--ink);border-left:4px solid #ffd100;padding-left:8px}

fieldset .wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:var(--chip);white-space:nowrap;font-weight:500}
.chip.ok{background:light-dark(#dcf3e5,#143a25)}.chip.bad{background:light-dark(#fde2e2,#3d1818)}.chip.warn{background:light-dark(#fff0d9,#3a2a12)}
.av{width:40px;height:40px;border-radius:50%;background:#111;color:#ffd100;border:2px solid #ffd100;display:grid;place-items:center;font:600 15px Outfit;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:84px;height:84px;font-size:28px}
.who{display:flex;gap:10px;align-items:center}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pitch);border-radius:6px}
.bar i.acc{background:#e0b400}
.brow{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.brow .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;flex:none}.tabs button.on{background:var(--chip);font-weight:600}
dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(920px,100vw - 16px);max-height:calc(100dvh - 16px)}
dialog::backdrop{background:#0008}
.dh{position:sticky;top:0;background:var(--card);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:2}
.dh h2{flex:1}.db{padding:18px}
.df{position:sticky;bottom:0;background:var(--card);padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:calc(32px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.lk{width:min(420px,100%);text-align:center}.lk img{border-radius:50%;box-shadow:0 0 0 5px #ffd100;display:block;margin:0 auto}.lk h1{font-size:26px;margin:18px 0 4px}.lk .card label{margin-top:10px}
.hbtn{min-height:34px;padding:0 12px;font-size:13px;border-radius:99px;background:#ffd100;color:#111;border:0;font-weight:600}
.locked #nav,.locked #sync,.locked #who,.locked #lockBtn{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw}
#toast.on{opacity:1}
.att button{min-width:44px}.att button.g.on{background:var(--ok);color:#fff;border-color:transparent}.att button.y.on{background:var(--bad);color:#fff;border-color:transparent}.att button.i.on{background:var(--warn);color:#fff;border-color:transparent}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.alert:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.scroll{overflow-x:auto}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}.spark i{flex:1;max-width:14px;background:var(--pitch);border-radius:3px 3px 0 0;min-height:3px}
.spark i:last-child{background:#e0b400}
.metric{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}
.top::before,.top::after{display:none}.sync{margin-left:0}.dh{padding:12px}.db{padding:12px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<script>
{
const LOGO=document.querySelector('.brand img').src;
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TL=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₺';
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const ymOf=d=>String(d||'').slice(0,7);
const curYM=()=>today().slice(0,7);
const addM=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+String(m).padStart(2,'0')};
const ymName=ym=>{const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'})};
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('tr-TR'):'—';
const days=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const ageAt=(b,at=today())=>b?(new Date(at+'T12:00')-new Date(b+'T12:00'))/(365.25*864e5):null;
const fullName=p=>((p.first||'')+' '+(p.last||'')).trim()||'İsimsiz';
const initials=p=>((p.first||'?')[0]+(p.last||'')[0]||'').toUpperCase();
const avatar=(p,lg)=>`<span class="av${lg?' lg':''}">${p.photo?`<img alt="" src="${esc(p.photo)}">`:esc(initials(p))}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)};
const num=v=>v===''||v==null?null:Number(String(v).replace(',','.'));
/* Sezon Temmuz'da başlar: 2026-27 sezonunda 2014 doğumlu = U13 */
const seasonEnd=()=>{const d=new Date();return d.getMonth()>=6?d.getFullYear()+1:d.getFullYear()};
const ucat=p=>p.birth?'U'+(seasonEnd()-Number(p.birth.slice(0,4))):'—';
const quarter=p=>p.birth?'Ç'+Math.ceil(Number(p.birth.slice(5,7))/3):null;

/* ---------- veri ---------- */
const DEF={name:'EPA',groups:['U8-U9','U10-U11','U12-U13','U14-U15','U16+','Kaleci'],fee:2500,dueDay:5,
 wa:'Merhaba {veli}, {oyuncu} için {ay} dönemi {tutar} ödemesi beklenmektedir. İyi günler dileriz, {akademi}'};
const S={players:{},payments:{},attendance:{},expenses:{},incomes:{},transfers:{},settings:{...DEF},deleted:{}};
let db=null,cloud=false,loaded=false;
const LK='akademi-yedek-v1',COLS=['players','payments','attendance','expenses','incomes','transfers'];
const nowISO=()=>new Date().toISOString();
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* Bu cihazın kimliği: eşitlemede kimin neyi girdiğini ayırmak için */
const DEV=lsGet('epa-device',null)||{id:uid(),name:''};lsSet('epa-device',DEV);
const SYNC=lsGet('epa-sync',null)||{lastSent:'',received:[]};
const saveSync=()=>lsSet('epa-sync',SYNC);
const devName=()=>DEV.name||'Bu cihaz';
function loadLocal(){const d=lsGet(LK,null);if(d){for(const c of COLS)Object.assign(S[c],d[c]||{});S.settings={...DEF,...(d.settings||{})};S.deleted=d.deleted||{}}}
function saveLocal(){lsSet(LK,S)}
async function writeDoc(col,id,obj){if(cloud){try{await db.collection(col).doc(id).set(obj)}catch(e){toast(e?.code==='quota_exceeded'?'Depolama sınırı doldu':'Kaydedilemedi: '+(e?.message||e))}}}
async function put(col,id,obj){
  obj={...obj,id,upd:nowISO(),by:devName(),dev:DEV.id};S[col][id]=obj;delete S.deleted[col+'/'+id];
  if(cloud)await writeDoc(col,id,obj);else saveLocal();
  render();return obj;
}
async function del(col,id){delete S[col][id];S.deleted[col+'/'+id]=nowISO();if(cloud){try{await db.collection(col).doc(id).delete()}catch(e){toast('Silinemedi')}}else saveLocal();render()}
async function putSettings(o){S.settings={...S.settings,...o,upd:nowISO()};if(cloud){try{await db.doc('settings/main').set(S.settings)}catch(e){toast('Ayar kaydedilemedi')}}else saveLocal();render()}

function pendingChanges(){
  const t=SYNC.lastSent||'';let n=0;
  for(const c of COLS)for(const o of Object.values(S[c]))if(o.dev===DEV.id&&(o.upd||'')>t)n++;
  for(const v of Object.values(S.deleted))if(v>t)n++;
  return n;
}

  return{epaSync:1,role:'admin',from:devName(),device:DEV.id,at:nowISO(),...Object.fromEntries(COLS.map(c=>[c,S[c]])),settings:S.settings,deleted:S.deleted}}

const stable=v=>Array.isArray(v)?'['+v.map(stable).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v);
const byId=(a,b)=>{const m={};(a||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});(b||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});return Object.values(m)};
function mergeRecord(col,local,inc){
  const newer=(inc.upd||'')>(local.upd||'')?inc:local,older=newer===inc?local:inc;
  if(col==='attendance')return{...newer,marks:{...(older.marks||{}),...(newer.marks||{})}};
  if(col==='players'){const o={...newer};for(const k of['tests','injuries','goals','evals'])if(older[k]||newer[k])o[k]=byId(older[k],newer[k]);return o}
  return newer;
}
async function mergeIn(d){
  if(!d||typeof d!=='object'||!COLS.some(c=>d[c]))throw new Error('EPA kayıt dosyası değil');
  const from=d.from,sentAt=d.at;d=restrictForRole(d);
  const st={add:0,upd:0,del:0,same:0},writes=[],dels=[];
  if(d.pkg){S.players={...d.players};if(d.settings)S.settings={...S.settings,name:d.settings.name||S.settings.name,groups:d.settings.groups||S.settings.groups,...(d.settings.users?{users:d.settings.users}:{})}}
  for(const c of COLS)for(const [id,inc] of Object.entries(d[c]||{})){
    if(!inc||typeof inc!=='object')continue;const tomb=S.deleted[c+'/'+id];
    if(tomb&&tomb>=(inc.upd||'')){st.same++;continue}
    const loc=S[c][id];
    if(!loc){S[c][id]={...inc,id};writes.push([c,id]);st.add++;continue}
    const m=mergeRecord(c,loc,inc);
    if(stable(m)!==stable(loc)){S[c][id]=m;writes.push([c,id]);st.upd++}else st.same++;
  }
  for(const [key,t] of Object.entries(d.deleted||{})){
    const [c,id]=key.split('/');if(!COLS.includes(c))continue;const loc=S[c][id];
    if(loc&&(loc.upd||'')<=t){delete S[c][id];dels.push([c,id]);st.del++}
    if(!S.deleted[key]||S.deleted[key]<t)S.deleted[key]=t;
  }
  if(!d.pkg&&d.settings&&(d.settings.upd||'')>(S.settings.upd||'')){const lu=S.settings.users||{},lr=S.settings.recovery;S.settings={...DEF,...d.settings,users:{...(d.settings.users||{}),...lu},...(lr?{recovery:lr}:{})};if(cloud){try{await db.doc('settings/main').set(S.settings)}catch(e){}}}
  else if(!d.pkg&&d.settings&&d.settings.users){const add=Object.fromEntries(Object.entries(d.settings.users).filter(([k])=>!(S.settings.users||{})[k]));if(Object.keys(add).length)S.settings={...S.settings,users:{...(S.settings.users||{}),...add}}}
  if(cloud){for(const [c,id] of writes)await writeDoc(c,id,S[c][id]);for(const [c,id] of dels){try{await db.collection(c).doc(id).delete()}catch(e){}}}
  else saveLocal();
  SYNC.received.unshift({from:from||'Bilinmeyen cihaz',sent:sentAt||'',at:nowISO(),...st});SYNC.received=SYNC.received.slice(0,20);saveSync();
  render();return st;
}

async function mergeText(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('Dosya okunamadı');return}

}
/* ---------- giriş, kullanıcılar ve yetkiler ---------- */
function sha256(s){
  s=unescape(encodeURIComponent(s));const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mw=2**32;
  if(!sha256.k){const k=[],h=[],comp={};let n=0;for(let c=2;n<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;h[n]=(c**.5*mw)|0;k[n++]=(c**(1/3)*mw)|0}}sha256.k=k;sha256.h0=h.slice(0,8)}
  const k=sha256.k;let hash=sha256.h0.slice();const words=[],bl=s.length*8;
  s+='\x80';while(s.length%64-56)s+='\x00';
  for(let i=0;i<s.length;i++)words[i>>2]|=s.charCodeAt(i)<<((3-i)%4)*8;
  words[words.length]=(bl/mw)|0;words[words.length]=bl;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  let r='';for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;r+=(b<16?'0':'')+b.toString(16)}return r;
}
const hashPw=(pw,salt)=>{let h=salt+'|'+pw;for(let i=0;i<6000;i++)h=sha256(h+salt);return h};
const rnd=(n,al='ABCDEFGHJKLMNPRSTUVYZ23456789')=>{const a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*1e9}return[...a].map(x=>al[x%al.length]).join('')};

  if(!can((location.hash||'#').slice(1)))location.hash=homeOf();render()}

/* gelen dosyayı bu telefonun rolüne göre süzer */
function restrictForRole(d){
  const mine=USER?USER.role:(hasUsers()?'admin':'setup');
  if(d.kind==='yardimci-paketi'&&mine==='admin')throw new Error('Bu dosya yardımcının telefonu için hazırlandı; yönetici telefonunda açılmaz.');
  if(d.kind==='yardimci-paketi'||mine==='yoklama')
    return{pkg:true,players:minPlayers(d.players),attendance:d.attendance||{},deleted:onlyDel(d.deleted,'attendance'),
      settings:d.settings?{name:d.settings.name,groups:d.settings.groups,users:d.kind==='yardimci-paketi'?d.settings.users:null}:null};
  if(d.role==='yoklama')return{attendance:d.attendance||{},deleted:onlyDel(d.deleted,'attendance'),from:d.from,at:d.at};
  return d;
}

/* ---------- ödeme mantığı ---------- */
const startYM=p=>ymOf(p.start||p.created||today());
const frozenSet=p=>new Set(String(p.frozen||'').split(/[,\s]+/).filter(Boolean));
function dueFor(p,ym){
  if(ym<startYM(p))return 0;
  if(p.status==='Ayrıldı'&&p.leftDate&&ym>ymOf(p.leftDate))return 0;
  if(p.status==='Ayrıldı'&&!p.leftDate)return 0;
  if(p.status==='Donduruldu'&&ym>=curYM())return 0;
  if(frozenSet(p).has(ym))return 0;
  return Math.round((Number(p.fee)||0)*(1-(Number(p.disc)||0)/100));
}
const payOf=(pid,ym)=>Object.values(S.payments).filter(x=>x.playerId===pid&&(!ym||x.period===ym));
const paidFor=(pid,ym)=>payOf(pid,ym).reduce((s,x)=>s+(Number(x.amount)||0),0);
const dueDay=p=>Number(p.dueDay)||Number(S.settings.dueDay)||5;
function isLate(p,ym){const t=today();return ym<curYM()||(ym===curYM()&&Number(t.slice(8,10))>dueDay(p))}
function statusFor(p,ym){
  const d=dueFor(p,ym),pd=paidFor(p.id,ym);
  if(d===0)return pd>0?['Ödendi','ok']:['Ücret yok',''];
  if(pd>=d)return['Ödendi','ok'];
  if(pd>0)return[isLate(p,ym)?'Eksik · gecikti':'Kısmi','warn'];
  return isLate(p,ym)?['Gecikti','bad']:['Bekleniyor',''];
}
function ledger(p){
  const out=[];let ym=startYM(p);const end=curYM();let guard=0;
  while(ym<=end&&guard++<240){const d=dueFor(p,ym),pd=paidFor(p.id,ym);if(d||pd)out.push({ym,d,pd});ym=addM(ym,1)}
  return out;
}
function debt(p){return ledger(p).filter(r=>isLate(p,r.ym)).reduce((s,r)=>s+Math.max(0,r.d-r.pd),0)}
function waLink(p,ym,amt){
  let ph=String(p.p1phone||p.p2phone||'').replace(/\D/g,'');if(!ph)return null;
  if(ph.startsWith('0'))ph=ph.slice(1);if(ph.length===10)ph='90'+ph;
  const t=S.settings.wa.replace('{veli}',p.p1name||'Veli').replace('{oyuncu}',fullName(p)).replace('{ay}',ymName(ym)).replace('{tutar}',TL(amt)).replace('{akademi}',S.settings.name);
  return 'https://wa.me/'+ph+'?text='+encodeURIComponent(t);
}

}

function growth(p){
  const T=testsOf(p).filter(t=>num(t.h));if(T.length<2)return null;const last=T[T.length-1];let best=null;
  for(const t of T.slice(0,-1)){const d=days(t.date,last.date);if(d>=90&&(!best||Math.abs(d-365)<Math.abs(days(best.date,last.date)-365)))best=t}
  if(!best)return null;const yr=days(best.date,last.date)/365.25;
  return{gv:(num(last.h)-num(best.h))/yr,wv:num(last.w)&&num(best.w)?(num(last.w)-num(best.w))/yr:null,from:best.date,to:last.date};
}

function maturity(p,t){
  const H=num(t.h),W=num(t.w),SH=num(t.sh),age=ageAt(p.birth,t.date);
  if(!H||!W||!SH||!age)return null;const LL=H-SH;let o;
  if(p.gender==='Kız')o=-9.376+0.0001882*(LL*SH)+0.0022*(age*LL)+0.005841*(age*SH)-0.002658*(age*W)+0.07693*(W/H*100);
  else o=-9.236+0.0002708*(LL*SH)-0.001663*(age*LL)+0.007216*(age*SH)+0.02292*(W/H*100);
  const ph=o<-1?'PHV öncesi':o>1?'PHV sonrası':'PHV civarı (büyüme atağı)';
  const moore=p.gender==='Kız'?-7.709133+0.0042232*(age*H):-8.1239+0.0070346*(age*SH);
  return{o,aphv:age-o,ph,moore,mooreAphv:age-moore};
}

performans(){
  const k=UI.perfK,T=TESTS.find(t=>t[0]===k);
  let L=active();if(UI.perfCat)L=L.filter(p=>ucat(p)===UI.perfCat);
  const R=L.map(p=>({p,t:lastTest(p,k)})).filter(x=>x.t).map(x=>({...x,v:num(x.t[k])})).sort((a,b)=>T[3]<0?a.v-b.v:b.v-a.v);
  const vals=R.map(r=>r.v),mn=Math.min(...vals),mx=Math.max(...vals);
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const cats=[...new Set(players().map(ucat))].filter(c=>c!=='—').sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  const mat=L.map(p=>{const t=testsOf(p).filter(x=>x.sh).pop();return t?{p,m:maturity(p,t)}:null}).filter(x=>x&&x.m).sort((a,b)=>b.m.o-a.m.o);
  V(`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2>Performans sıralaması</h2></div>
  <div class="row" style="margin-bottom:12px"><select id="f_pk" style="max-width:260px">${TESTS.map(t=>`<option value="${t[0]}" ${k===t[0]?'selected':''}>${t[1]} (${t[2]})</option>`).join('')}</select>
   <select id="f_pc" style="max-width:160px"><option value="">Tüm yaşlar</option>${cats.map(c=>`<option ${UI.perfCat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="grid k2"><div class="card"><h3>${esc(T[1])} · son ölçüm</h3><p class="small mute">${T[3]<0?'Düşük değer daha iyi':'Yüksek değer daha iyi'} · ortalama ${vals.length?avg.toFixed(2)+' '+T[2]:'—'}</p>
   ${R.length?R.map((r,i)=>{const w=mx===mn?100:T[3]<0?(mx-r.v)/(mx-mn)*85+15:(r.v-mn)/(mx-mn)*85+15;return`<div class="brow" style="grid-template-columns:minmax(0,10em) minmax(0,1fr) auto"><a href="#" data-open="${r.p.id}" style="color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i+1}. ${esc(fullName(r.p))}</a><div class="bar"><i class="${i<3?'acc':''}" style="width:${w}%"></i></div><span class="n">${r.v} ${T[2]}</span></div>`}).join(''):'<p class="mute">Bu test için ölçüm yok. Oyuncu kartı › Performans sekmesinden test ekleyin.</p>'}</div>
  <div class="card"><h3>Biyolojik olgunlaşma (PHV)</h3><p class="small mute">Mirwald yöntemi: boy, kilo ve oturma boyundan PHV'ye kalan süre. Biyo-bantlama ve yük yönetimi için kullanın; büyüme atağındaki oyuncularda sıçrama ve sprint hacmini dikkatle planlayın.</p>
   ${mat.length?`<table class="stack"><thead><tr><th>Oyuncu</th><th class="n">Ofset (yıl)</th><th class="n">Tahmini PHV yaşı</th><th>Evre</th></tr></thead><tbody>${mat.map(x=>`<tr><td>${esc(fullName(x.p))}</td><td class="n">${x.m.o>0?'+':''}${x.m.o.toFixed(1)}</td><td class="n">${x.m.aphv.toFixed(1)}</td><td><span class="chip ${Math.abs(x.m.o)<=1?'warn':''}">${x.m.ph}</span></td></tr>`).join('')}</tbody></table>`:'<p class="mute">Oturma boyu girilmiş ölçüm yok.</p>'}</div></div>`);
  $('#f_pk').onchange=e=>{UI.perfK=e.target.value;render()};$('#f_pc').onchange=e=>{UI.perfCat=e.target.value;render()};
},

function alerts(){
  const out=[],t=today(),ym=curYM();
  for(const p of active()){
    const n=fullName(p);
    if(p.healthExp){const d=days(t,p.healthExp);if(d<0)out.push({id:p.id,n,t:'Sağlık raporunun süresi dolmuş',c:'bad',w:0});else if(d<=30)out.push({id:p.id,n,t:`Sağlık raporu ${d} gün içinde bitiyor`,c:'warn',w:1})}
    else out.push({id:p.id,n,t:'Sağlık raporu bilgisi yok',c:'warn',w:3});
    if(p.licenseExp&&days(t,p.licenseExp)<=30)out.push({id:p.id,n,t:days(t,p.licenseExp)<0?'Lisans vizesi bitmiş':'Lisans vizesi yaklaşıyor',c:'warn',w:2});
    if(!p.kvkk)out.push({id:p.id,n,t:'KVKK onayı alınmamış',c:'warn',w:3});
    if(!p.contract)out.push({id:p.id,n,t:'Kayıt sözleşmesi eksik',c:'warn',w:4});
    const inj=(p.injuries||[]).find(i=>!i.back||i.back>=t);if(inj)out.push({id:p.id,n,t:'Sakatlık: '+(inj.part||'')+(inj.back?' · dönüş '+fdate(inj.back):''),c:'bad',w:1});
    const a=attStats(p.id,30);if(a.n>=4&&a.pct<60)out.push({id:p.id,n,t:`Düşük katılım: %${a.pct} (30 gün)`,c:'warn',w:2});
    if(p.birth&&p.birth.slice(5,7)===ym.slice(5,7))out.push({id:p.id,n,t:`Doğum günü ${Number(p.birth.slice(8,10))} ${ymName(ym).split(' ')[0]} · ${Number(ym.slice(0,4))-Number(p.birth.slice(0,4))} yaşına giriyor`,c:'ok',w:5});
    const lt=testsOf(p).pop();if(!lt||days(lt.date,t)>120)out.push({id:p.id,n,t:lt?'Son testin üzerinden 4 aydan fazla geçti':'Hiç performans testi yok',c:'mute',w:6});
  }
  return out.sort((a,b)=>a.w-b.w);
}

function evalDialog(p){
  sub(`<form><div class="dh"><h2>Değerlendirme · ${esc(fullName(p))}</h2><button type="button" class="sm" data-close aria-label="Kapat">✕</button></div><div class="db"><fieldset>
  <label>Tarih<input type="date" name="date" value="${today()}" required></label><label>Değerlendiren<input name="by"></label>
  ${CORNERS.map(([k,l])=>`<label>${l} (1–5)<select name="${k}">${[1,2,3,4,5].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}
  <label class="wide">Güçlü yönler, gelişim alanları, öneriler<textarea name="note"></textarea></label></fieldset></div>
  <div class="df"><button type="button" data-close>Vazgeç</button><button class="p">Kaydet</button></div></form>`,async f=>{
   await put('players',p.id,{...p,evals:[...(p.evals||[]),{id:uid(),...Object.fromEntries(f)}]});openPlayer(p.id,'gelisim')});
}
function receipt(id){
  const x=S.payments[id];if(!x)return;const p=S.players[x.playerId]||{};
  const txt=`${S.settings.name}\nTAHSİLAT MAKBUZU  No: ${x.rno||x.id}\nTarih: ${fdate(x.date)}\nSporcu: ${fullName(p)}\nVeli: ${p.p1name||'-'}\nDönem: ${ymName(x.period)}\nTutar: ${TL(x.amount)}\nYöntem: ${x.method||'-'}${x.note?'\nNot: '+x.note:''}`;
  const box=document.createElement('dialog');box.style.width='min(460px,100vw - 16px)';
  box.innerHTML=`<div class="dh"><h2>Makbuz</h2><button class="sm" id="cx" aria-label="Kapat">✕</button></div><div class="db"><pre style="white-space:pre-wrap;font:15px/1.6 Inter;background:var(--chip);padding:14px;border-radius:10px">${esc(txt)}</pre><div class="row" style="justify-content:flex-end"><button id="cp">Kopyala</button>${waLink(p,x.period,0)?`<a class="btn p" target="_blank" rel="noopener" href="https://wa.me/${esc(waLink(p,x.period,0).split('/')[3].split('?')[0])}?text=${encodeURIComponent(txt)}">WhatsApp ile gönder</a>`:''}</div></div>`;
  document.body.append(box);box.showModal();box.querySelector('#cx').onclick=()=>{box.close();box.remove()};
  box.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Kopyalandı')}catch(e){toast('Kopyalanamadı')}};
}

/* ---------- dışa aktarma ---------- */
function csv(rows,cols,map=x=>x){const q=v=>{v=v==null?'':typeof v==='boolean'?(v?'Evet':'Hayır'):String(v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+cols.map(c=>q(c[1])).join(';')+'\n'+rows.map(map).map(r=>cols.map(c=>q(r[c[0]])).join(';')).join('\n')}
/* iPhone web uygulaması: dosyaları iOS paylaşma ekranıyla gönder (WhatsApp, Dosyalar, Drive) */
const mimeOf=n=>/\.pdf$/i.test(n)?'application/pdf':/\.csv$/i.test(n)?'text/csv':/\.json$/i.test(n)?'application/json':/\.html?$/i.test(n)?'text/html':'text/plain';
function canShareFiles(){try{return!!(window.EPA_PWA&&navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]}))}catch(e){return false}}
async function shareFile(name,data){
  const f=new File([data],name,{type:mimeOf(name)});
  try{await navigator.share({files:[f],title:name});return true}catch(e){if(e&&e.name==='AbortError')return true;return false}
}
async function exportFile(name,data){
  if(window.EPAAndroid){try{EPAAndroid.save(name,data);return}catch(e){}}
  if(canShareFiles()&&await shareFile(name,data))return;
  try{const dl=window.claude?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});toast(name+' hazır');return}}catch(e){if(e?.code==='cancelled'||/declin|cancel/i.test(e?.message||''))return}
  const box=document.createElement('dialog');box.style.width='min(720px,100vw - 16px)';box.innerHTML=`<div class="dh"><h2>${esc(name)}</h2><button class="sm" id="cx">✕</button></div><div class="db"><p class="small mute">İndirme bu görünümde açılamadı. Metni kopyalayıp bir dosyaya yapıştırın.</p><textarea style="min-height:300px;font-size:13px" readonly>${esc(data)}</textarea><button id="cp" class="p" style="margin-top:10px">Kopyala</button></div>`;
  document.body.append(box);box.showModal();box.querySelector('#cx').onclick=()=>{box.close();box.remove()};box.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(data);toast('Kopyalandı')}catch(e){box.querySelector('textarea').select()}};
}

/* ---------- genel olaylar ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('#lockBtn')){lockApp();return}
  if(e.target.closest('[data-send]')){sendSync();return}
  if(!isAdmin())return;
  const o=e.target.closest('[data-open]');if(o){e.preventDefault();PT='ozet';openPlayer(o.dataset.open);return}
  const pay=e.target.closest('[data-pay]');if(pay){payDialog(pay.dataset.pay,pay.dataset.ym);return}
  const r=e.target.closest('[data-rcpt]');if(r){receipt(r.dataset.rcpt);return}
  const dp=e.target.closest('[data-delpay]');if(dp){ask('Bu ödeme kaydı silinsin mi?',async()=>{const pid=S.payments[dp.dataset.delpay]?.playerId;await del('payments',dp.dataset.delpay);if($('#dlg').open&&pid)openPlayer(pid,PT)})}
});
window.addEventListener('hashchange',render);

/* ---------- başlat ---------- */
loadLocal();restoreSession();render();
if(window.EPA_PWA){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&!USER){rl=true;location.reload()}})}}
window.epaPaused=()=>{HIDDEN=Date.now()};window.epaResumed=()=>{if(USER&&HIDDEN&&Date.now()-HIDDEN>5*60e3)lockApp()};
const setSync=(t)=>$('#sync').textContent=t;
setSync('Yerel kayıt');
(async()=>{
  if(!window.claude?.use){setSync('Bu cihazda kayıtlı');AUTHREADY=true;return}
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){setSync('Bu cihazda kayıtlı');AUTHREADY=true;render();return}
  cloud=true;setSync('Eşitleniyor…');
  const timer=setTimeout(()=>setSync('Bağlantı bekleniyor'),10000);let got=0;
  const done=()=>{if(++got>=COLS.length+1){clearTimeout(timer);setSync('Bulutta kayıtlı ✓')}};
  for(const c of COLS){let first=true;
    db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[c]=o;if(first&&!snap.metadata.fromCache){first=false;done()}render();if($('#dlg').open&&c==='players'){}},
      err=>{clearTimeout(timer);setSync('Eşitleme hatası');})}
  let fs=true;db.doc('settings/main').onSnapshot(d=>{if(d.exists)S.settings={...DEF,...d.data()};if(fs&&!d.metadata.fromCache){fs=false;done();AUTHREADY=true;restoreSession()}render()},()=>{AUTHREADY=true;render()});
})();
}
</script>
